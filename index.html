<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horas extras · Gestión de solicitudes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --carbon:#26262B; --carbon-2:#34343A; --rojo:#B3202A; --rojo-suave:#FBE9EA;
  --bg:#F3F4F6; --surface:#FFFFFF; --ink:#1C1D21; --muted:#62656D; --line:#E2E4E8;
  --turno:#DDE1E7; --dentro:#A9B0BB; --glpi:#2F5D8A; --glpi-bg:#E8EFF7;
  --ok:#2F7D4F; --ok-bg:#E6F4EC; --warn:#9A5B00; --warn-bg:#FDF1DD;
  --focus:#1F6FEB; --shadow:0 1px 2px rgba(20,22,28,.06),0 4px 16px rgba(20,22,28,.06);
  --font:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15161A; --surface:#1F2025; --ink:#ECEDEF; --muted:#A2A6AE; --line:#30323A;
    --turno:#343843; --dentro:#6B7280; --glpi:#8DB7E3; --glpi-bg:#1E2B3A;
    --ok:#7FD1A2; --ok-bg:#16301F; --warn:#F2BE6A; --warn-bg:#35270F; --rojo-suave:#3A1A1D;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#15161A; --surface:#1F2025; --ink:#ECEDEF; --muted:#A2A6AE; --line:#30323A;
  --turno:#343843; --dentro:#6B7280; --glpi:#8DB7E3; --glpi-bg:#1E2B3A;
  --ok:#7FD1A2; --ok-bg:#16301F; --warn:#F2BE6A; --warn-bg:#35270F; --rojo-suave:#3A1A1D;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}

/* Sidebar */
.side{background:var(--carbon);color:#E9E9EC;padding:22px 14px;display:flex;flex-direction:column;gap:24px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-weight:700;letter-spacing:.02em;font-size:17px}
.brand-dot{width:22px;height:22px;border-radius:50%;background:var(--rojo);display:grid;place-items:center;color:#fff;font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav small{color:#9A9AA3;font-size:12px;padding:10px 10px 4px}
.nav a{color:#D4D4DA;text-decoration:none;padding:9px 10px;border-radius:8px;display:flex;align-items:center;gap:10px;font-size:14.5px}
.nav a:hover{background:var(--carbon-2);color:#fff}
.nav a[aria-current="page"]{background:var(--carbon-2);color:#fff;box-shadow:inset 3px 0 0 var(--rojo)}
.nav svg{width:18px;height:18px;flex:none;opacity:.85}
.side-foot{margin-top:auto;padding:12px 10px;border-top:1px solid #3A3A41;font-size:13px;color:#B8B8C0}
.side-foot b{display:block;color:#fff;font-weight:600}

/* Main */
main{padding:26px 32px 48px;max-width:1240px;width:100%}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:6px}
.crumbs a{color:inherit;text-decoration:none}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
h1{font-size:28px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);margin:4px 0 0;font-size:14.5px}
.head-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:7px;cursor:pointer;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--carbon);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#ECEDEF;color:#15161A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#ECEDEF;color:#15161A}}
.select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}

/* Period ribbon – the signature element */
.period{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:grid;grid-template-columns:1.1fr 2fr;gap:24px;box-shadow:var(--shadow);margin-bottom:18px}
.total{display:flex;flex-direction:column;justify-content:center}
.total .label{color:var(--muted);font-size:13.5px}
.total .big{font-size:40px;font-weight:700;line-height:1.05;letter-spacing:-.02em}
.total .big span{font-size:20px;font-weight:600;color:var(--muted);margin:0 6px 0 2px}
.total .meta{font-size:13.5px;color:var(--muted);margin-top:6px}
.cal{display:flex;flex-direction:column;gap:8px}
.cal-top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(31,1fr);gap:3px;align-items:end;height:64px}
.day{background:var(--turno);border-radius:3px;min-height:6px;position:relative;cursor:default}
.day.has{background:var(--rojo)}
.day.we{outline:1px dashed var(--line);background:transparent}
.day.we.has{background:var(--rojo);outline:0}
.day.today{box-shadow:0 0 0 2px var(--ink)}
.cal-legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.cal-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* Tabs + toolbar */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14.5px;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center}
.tab[hidden]{display:none}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--rojo)}
.count{background:var(--warn-bg);color:var(--warn);border-radius:999px;padding:1px 8px;font-size:12px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 36px;font-size:14.5px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.chips{display:flex;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* Table */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
th{text-align:left;font-size:12.5px;font-weight:600;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th button{all:unset;cursor:pointer}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14.5px}
tbody tr{cursor:pointer}
tbody tr:hover{background:color-mix(in srgb,var(--bg) 70%,transparent)}
tbody tr:last-child td{border-bottom:0}
.t-date b{display:block;font-weight:600}
.t-date small{color:var(--muted);font-size:12.5px}
.ticket{font-weight:600}
.client{color:var(--muted);font-size:13px;display:block}
.num{text-align:right;font-weight:700;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:600;white-space:nowrap}
.b-glpi{background:var(--glpi-bg);color:var(--glpi)}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-cat{background:var(--bg);color:var(--muted)}

/* Day strip */
.strip{position:relative;width:180px;height:18px;border-radius:4px;background:var(--bg);overflow:hidden}
.strip .shift{position:absolute;top:0;bottom:0;background:var(--turno)}
.strip .in{position:absolute;top:5px;bottom:5px;background:var(--dentro);border-radius:2px}
.strip .out{position:absolute;top:3px;bottom:3px;background:var(--rojo);border-radius:2px}
.strip-scale{display:flex;justify-content:space-between;width:180px;font-size:10.5px;color:var(--muted);margin-top:2px}

.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-size:13.5px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn-primary{background:var(--rojo);border-color:var(--rojo);color:#fff}
.btn-primary:hover{filter:brightness(1.08);border-color:var(--rojo)}
.row-actions{display:flex;gap:6px;justify-content:flex-end}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(15,16,20,.38);opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;z-index:10}
.drawer.open{transform:none}
.d-head{padding:20px 22px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.d-head h2{margin:4px 0 0;font-size:20px}
.d-body{padding:18px 22px;overflow:auto;display:flex;flex-direction:column;gap:18px}
.d-elig{display:flex;align-items:baseline;gap:8px}
.d-elig b{font-size:30px;letter-spacing:-.02em;white-space:nowrap}
.d-strip .strip,.d-strip .strip-scale{width:100%}
.d-strip .strip{height:26px}
dl{display:grid;grid-template-columns:140px 1fr;gap:10px 14px;margin:0;font-size:14.5px}
dt{color:var(--muted)}
dd{margin:0}
.desc{background:var(--bg);border-radius:10px;padding:12px 14px;font-size:14.5px}
.trail{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;font-size:13.5px}
.trail li{display:grid;grid-template-columns:12px 1fr;gap:10px}
.trail li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--muted);margin-top:6px}
.trail li.ok::before{background:var(--ok)}
.trail time{color:var(--muted);display:block;font-size:12.5px}
.d-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
h3{font-size:13.5px;margin:0 0 8px;color:var(--muted);font-weight:600}

/* Dialog + toast */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(480px,92vw);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(15,16,20,.45)}
.dlg{padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font-size:19px}
.dlg textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);resize:vertical}
.dlg .err{color:var(--rojo);font-size:13px;min-height:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--carbon);color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hint{font-size:13px;color:var(--muted);margin:10px 2px 0}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{flex-direction:row;align-items:center;padding:12px 16px;gap:12px;overflow-x:auto}
  .nav{flex-direction:row}.nav small,.side-foot{display:none}
  main{padding:20px 16px 40px}
  .period{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.nav a.locked{opacity:.45}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi span{color:var(--muted);font-size:13px;display:block}
.kpi b{font-size:26px;letter-spacing:-.01em;display:block;margin-top:2px}
.kpi small{color:var(--muted);font-size:12.5px}
.kpi.alert b{color:var(--warn)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.panel h2{font-size:16px;margin:0 0 12px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--glpi-bg);color:var(--glpi);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:14px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.b-red{background:var(--rojo-suave);color:var(--rojo)}
.b-gray{background:var(--bg);color:var(--muted)}
details.tk{border-bottom:1px solid var(--line)}
details.tk:last-child{border-bottom:0}
details.tk summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:24px 110px 1fr 120px 170px auto;gap:12px;align-items:center;padding:12px 14px}
details.tk summary::-webkit-details-marker{display:none}
details.tk summary .chev{transition:transform .15s;color:var(--muted)}
details.tk[open] summary .chev{transform:rotate(90deg)}
.tk-body{padding:0 14px 14px 50px}
.tk-body table{min-width:760px;border:1px solid var(--line);border-radius:10px}
.tk-body td,.tk-body th{padding:9px 10px;font-size:13.5px}
.log{max-height:420px;overflow:auto}
.log td{font-size:13.5px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form .full{grid-column:1/-1}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--bg)}
.field .help{font-size:12px;color:var(--muted);margin-top:4px}
.days-pick{display:flex;gap:6px;flex-wrap:wrap}
.days-pick label{display:flex;gap:4px;align-items:center;font-weight:500;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 10px;font-size:13px}
.tag button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 4px}
.inline{display:flex;gap:8px;align-items:center}
.inline input{border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--bg)}
.denied{padding:60px 20px;text-align:center}
.denied b{font-size:18px;display:block;margin-bottom:6px}
.sim{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#B8B8C0;margin-top:10px}
.sim button{background:none;border:1px solid #4A4A52;color:#D4D4DA;border-radius:7px;padding:4px 8px;cursor:pointer;font-size:12px}
.mt{margin-top:16px}
.guide{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--rojo);border-radius:12px;margin:0 0 18px;font-size:14px}
.guide>summary{cursor:pointer;padding:12px 16px;font-weight:700;list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.guide>summary::-webkit-details-marker{display:none}
.guide>summary::before{content:"▸";color:var(--rojo);transition:transform .15s}
.guide[open]>summary::before{transform:rotate(90deg)}
.guide .hu{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.g-body{padding:0 18px 14px;display:grid;gap:8px}
.g-body p{margin:0}.g-body h4{margin:6px 0 0;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.g-body ol,.g-body ul{margin:0;padding-left:20px;display:grid;gap:4px}
.dlg-guide{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;margin:0 0 12px}
.dlg-guide b{display:block;margin-bottom:4px}.dlg-guide ol,.dlg-guide ul{margin:0;padding-left:18px;display:grid;gap:2px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Navegación principal">
    <div class="brand"><span class="brand-dot" aria-hidden="true">C</span>Compsesa RRHH</div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <b id="who-name"></b><span id="who-role"></span>
      <div class="sim">Datos de demostración <button id="reset" type="button">Reiniciar</button></div>
    </div>
  </aside>
  <main>
    <div class="head" style="margin-bottom:14px">
      <div class="crumbs" id="crumbs" style="margin:0"></div>
      <div class="head-actions">
        <label class="visually-hidden" for="role">Ver como</label>
        <select id="role" class="select" title="Simula el rol del usuario conectado">
          <option value="colab">Ver como: Colaborador</option>
          <option value="sac">Ver como: Coordinador SAC</option>
          <option value="rrhh">Ver como: Recursos Humanos</option>
          <option value="admin">Ver como: Administrador</option>
        </select>
        <label class="visually-hidden" for="period">Período de nómina</label>
        <select id="period" class="select"></select>
        <button class="iconbtn" id="theme" type="button" aria-label="Cambiar tema claro u oscuro"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/></svg></button>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title" aria-hidden="true">
  <div class="d-head"><div id="d-tag"></div><button class="iconbtn" id="d-close" aria-label="Cerrar detalle"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="d-body" id="d-body"></div>
  <div class="d-foot"><button class="btn" id="d-close2">Cerrar</button></div>
</aside>
<dialog id="dlg"><form class="dlg" id="dlg-form" novalidate></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ============ Datos semilla ============ */

const SEED=()=>({

function calcElig(ini,fin,turno){

      const pcs=[[t,se<a?se:a,"elegible"],[t>a?t:a,se<b?se:b,"turno"],[t>b?t:b,se,"elegible"]];

      :`<div class="kpi ${pend?"alert":""}"><span>Pendientes de homologación</span><b>${pend}</b><small>${S.pend.filter(x=>x.estado==="revalidar").length} listos para revalidar</small></div>`}

function calendar(es,p){
  const by={};es.forEach(e=>e.tramos.filter(t=>t.tipo==="elegible").forEach(t=>{const k=t.ini.slice(0,10);by[k]=(by[k]||0)+(D(t.fin)-D(t.ini))/6e4}));
  const max=Math.max(60,...Object.values(by));let h="";const td=S.config.now.slice(0,10);
  for(let d=D(p.start+"T00:00");ymd(d)<=p.end;d.setDate(d.getDate()+1)){const k=ymd(d),v=by[k]||0,f=isFree(d,S.config.turnoDef);
    h+=`<div class="day ${v?"has":""} ${f?"we":""} ${k===td?"today":""}" style="height:${v?Math.max(18,v/max*100):(f?100:22)}%" title="${fDay(d)}${v?" · "+fMin(v):""}"></div>`}
  const tot=es.reduce((a,e)=>a+e.elig,0);
  return `<div class="total"><span class="label">Tiempo elegible del período</span><div class="big">${Math.floor(tot/60)}<span>h</span>${pad(tot%60)}<span>min</span></div><div class="meta">Día marcado con borde = hoy (${fDay(D(S.config.now))})</div></div>
  <div class="cal"><div class="cal-top"><span>${p.label.split(" – ")[0]}</span><span>Horas elegibles por día</span><span>${p.label.split(" – ")[1]} · cierre</span></div>
  <div class="days" style="grid-template-columns:repeat(${Object.keys(by).length?31:31},1fr)" role="img" aria-label="Horas elegibles por día">${h}</div>
  <div class="cal-legend"><span><i style="background:var(--rojo)"></i>Con tiempo elegible</span><span><i style="background:var(--turno)"></i>Día laborable</span><span><i style="outline:1px dashed var(--muted);outline-offset:-1px"></i>Fin de semana o feriado</span></div></div>`;
}

    <div class="field"><label for="f-id">N° de identificación</label><input id="f-id" inputmode="numeric" value="${esc(u.idNum)}"><div class="help">10 dígitos, sin guiones. El cambio aplica a todas las tareas de este usuario.</div></div>`,"Guardar corrección",()=>{
      const v=val("f-id");if(!/^\d{10}$/.test(v))return"El número debe tener exactamente 10 dígitos.";if(v===u.idNum)return"El número es igual al actual; cámbialo o cancela.";
      const old=u.idNum;u.idNum=v;S.pend.filter(p=>ticket(p.ticketId).tasks.find(y=>y.id===p.taskId).user===u.user).forEach(p=>{p.estado="revalidar";p.trail.push({at:S.config.now,txt:`${ROLES[UI.role].nombre} (SAC) corrigió el N° en GLPI: ${old} → ${v}.`})});
      save();toast("Corrección guardada. Se revalida en la próxima sincronización.")})},
  askrrhh(b){const x=S.pend.find(p=>p.key===b.dataset.key),k=ticket(x.ticketId).tasks.find(y=>y.id===x.taskId),u=gUser(k.user);
    dialog("Solicitar corrección a RRHH",`<p class="sub" style="margin:0">Usa esta opción si el número en GLPI (<b>${esc(u.idNum)}</b>) es correcto y el de Nómina no.</p>
    <div class="dlg-guide"><b>Qué hacer (HE-GLPI-05)</b><ol><li>Explica a Recursos Humanos qué número es el correcto y dónde está el error en Nómina.</li><li>RRHH corrige el perfil oficial en Nómina.</li><li>Cuando lo marquen como realizado, el registro se revalida en la siguiente sincronización y pasa al perfil del colaborador.</li></ol></div>
    <div class="field"><label for="f-msg">Detalle para Recursos Humanos</label><textarea id="f-msg" rows="4" placeholder="Ej.: La cédula de Ana Vera es ${esc(u.idNum)}; en Nómina figura con dos dígitos invertidos."></textarea></div>`,"Enviar solicitud",()=>{
      const m=val("f-msg");if(m.length<10)return"Escribe el detalle de la corrección (mínimo 10 caracteres).";
      S.seq.sol++;S.sol.push({id:S.seq.sol,key:x.key,ticketId:x.ticketId,user:u.user,idNum:u.idNum,msg:m,at:S.config.now,estado:"abierta"});
      x.estado="rrhh";x.trail.push({at:S.config.now,txt:`SAC solicitó a RRHH corregir el N° en Nómina: “${m}”`});save();toast("Solicitud enviada a Recursos Humanos")})},
  solok(b){const s=S.sol.find(x=>x.id==b.dataset.id);s.estado="atendida";const x=S.pend.find(p=>p.key===s.key);
    if(x){x.estado="revalidar";x.trail.push({at:S.config.now,txt:`RRHH (${ROLES[UI.role].nombre}) marcó la corrección en Nómina como realizada.`})}
    const hit=S.empleados.find(e=>e.cedula===s.idNum);save();render();toast(hit?`Listo: ${hit.nombre} ya tiene ${s.idNum}. Se revalida en la próxima sincronización.`:`Aviso: ningún empleado tiene ${s.idNum}. Edita el empleado antes o fallará la revalidación.`)},
  editemp(b){const e=emp(b.dataset.id);
    dialog(`Editar ${esc(e.nombre)}`,`<div class="form"><div class="field full"><label for="f-ced">N° de identificación</label><input id="f-ced" inputmode="numeric" value="${e.cedula}"></div>
    <div class="field"><label for="f-ini">Inicio de turno</label><select id="f-ini">${[6,7,8,9,10].map(h=>`<option ${h===e.turno.ini?"selected":""}>${h}</option>`).join("")}</select></div>
    <div class="field"><label for="f-fin">Fin de turno</label><select id="f-fin">${[15,16,17,18,19,20].map(h=>`<option ${h===e.turno.fin?"selected":""}>${h}</option>`).join("")}</select></div>
    <div class="field full"><label>Días laborables</label><div class="days-pick">${[1,2,3,4,5,6,0].map(d=>`<label><input type="checkbox" name="dia" value="${d}" ${e.turno.dias.includes(d)?"checked":""}>${DOW[d]}</label>`).join("")}</div></div></div>
    <p class="help" style="margin:0;color:var(--muted);font-size:12.5px">El turno nuevo aplica a cálculos futuros; los registros ya creados conservan el turno con que se calcularon.</p>`,"Guardar",()=>{
      const c=val("f-ced");if(!/^\d{10}$/.test(c))return"El número debe tener exactamente 10 dígitos.";
      if(S.empleados.some(x=>x.cedula===c&&x.id!==e.id))return"Ese número ya pertenece a otro colaborador.";
      const dias=[...document.querySelectorAll('[name=dia]:checked')].map(x=>+x.value);if(!dias.length)return"Selecciona al menos un día laborable.";
      const ini=+val("f-ini"),fin=+val("f-fin");if(fin<=ini)return"El fin del turno debe ser posterior al inicio.";
      e.cedula=c;e.turno={ini,fin,dias};save();toast(`${e.nombre} actualizado`)})},
  newticket(){dialog("Nuevo ticket en GLPI",`<div class="dlg-guide"><b>Qué hacer (HE-GLPI-01)</b><ol><li>Escribe el cliente atendido y elige el estado.</li><li>Crea el ticket y luego <b>agrégale tareas</b>.</li><li>Ciérralo: solo los tickets <b>Cerrados</b> pasan a horas extras, y la fecha de cierre debe caer en el período 21→20.</li></ol></div><div class="form"><div class="field full"><label for="f-cli">Cliente</label><input id="f-cli" placeholder="Ej.: Hospital San Rafael"></div>
    <div class="field"><label for="f-est">Estado</label><select id="f-est"><option>Abierto</option><option>Cerrado</option></select></div>
    <div class="field"><label for="f-cie">Fecha de cierre</label><input type="datetime-local" id="f-cie" value="${S.config.now}"><div class="help">Solo se usa si el estado es Cerrado.</div></div></div>`,"Crear ticket",()=>{
      const cli=val("f-cli"),est=val("f-est");if(cli.length<3)return"Escribe el nombre del cliente.";
      S.seq.ticket++;const id=String(S.seq.ticket);S.tickets.push({id,cliente:cli,estado:est,cierre:est==="Cerrado"?val("f-cie"):null,tasks:[]});UI.openTk=id;save();toast(`Ticket #${id} creado. Agrégale tareas.`)})},
  newtask(b){const t=ticket(b.dataset.tk);const d=S.config.now.slice(0,10);
    dialog(`Agregar tarea al ticket #${t.id}`,`<div class="dlg-guide"><b>Qué hacer (HE-GLPI-01 · 02 · 03)</b><ul><li>Indica quién hizo la tarea, categoría, inicio, fin y el trabajo realizado. El cliente (${esc(t.cliente)}) y el ticket #${t.id} se toman del ticket.</li><li><b>Standby</b> se descarta y no genera horas extras.</li><li>Solo cuenta lo que cae fuera del turno (L–V 09:00–18:00 de referencia) o en sábado, domingo o feriado.</li><li>El ticket debe estar <b>Cerrado</b> para que la tarea se procese.</li></ul></div><div class="form"><div class="field"><label for="f-us">Usuario GLPI</label><select id="f-us">${S.glpiUsers.map(u=>`<option value="${u.user}">${u.user} (${esc(u.nombre)})</option>`).join("")}</select></div>
    <div class="field"><label for="f-cat">Categoría</label><select id="f-cat"><option>Soporte</option><option>Proyectos</option><option>Standby</option></select></div>
    <div class="field"><label for="f-i">Inicio</label><input type="datetime-local" id="f-i" value="${d}T18:00"></div>
    <div class="field"><label for="f-f">Fin</label><input type="datetime-local" id="f-f" value="${d}T20:30"></div>
    <div class="field full"><label for="f-d">Descripción</label><textarea id="f-d" rows="2" placeholder="Trabajo realizado"></textarea></div></div>`,"Agregar tarea",()=>{
      const i=val("f-i"),f=val("f-f"),ds=val("f-d");if(!i||!f)return"Indica inicio y fin.";if(D(f)<=D(i))return"El fin debe ser posterior al inicio.";if((D(f)-D(i))/36e5>24)return"Una tarea no puede durar más de 24 horas.";if(ds.length<3)return"Describe el trabajo realizado.";
      if(S.processed[`${t.id}-${t.tasks.length+1}`])return"Error interno de numeración.";
      t.tasks.push({id:t.tasks.length?Math.max(...t.tasks.map(k=>k.id))+1:1,user:val("f-us"),cat:val("f-cat"),desc:ds,ini:i,fin:f});UI.openTk=t.id;save();toast(`Tarea agregada al ticket #${t.id}`)})},
  close(b){const t=ticket(b.dataset.tk);if(!t.tasks.length){toast("Agrega al menos una tarea antes de cerrar el ticket");return}t.estado="Cerrado";t.cierre=S.config.now;UI.openTk=t.id;save();render();toast(`Ticket #${t.id} cerrado. Entra en la próxima sincronización.`)},
  users(){dialog("Usuarios GLPI",`<table style="min-width:0"><thead><tr><th>Usuario</th><th>Nombre</th><th>N° ID</th></tr></thead><tbody>${S.glpiUsers.map(u=>`<tr style="cursor:default"><td>${u.user}</td><td>${esc(u.nombre)}</td><td>${esc(u.idNum)}</td></tr>`).join("")}</tbody></table><p class="sub" style="margin:0">El número lo registra SAC manualmente en GLPI.</p>`,"Listo",()=>null)},
  savecfg(){const n=$("#cfg-now").value,c=+$("#cfg-corte").value;if(!n){toast("Indica la fecha del sistema");return}if(!(c>=1&&c<=28)){toast("El día de corte debe estar entre 1 y 28");return}
    S.config.now=n;S.config.corte=c;UI.period=periodOf(n).start;save();render();toast("Configuración guardada")},
  addcat(){const v=$("#cfg-cat").value.trim();if(!v)return;if(!S.config.excluir.includes(v))S.config.excluir.push(v);save();render()},
  rmcat(b){S.config.excluir=S.config.excluir.filter(x=>x!==b.dataset.v);save();render()},
  addfer(){const v=$("#cfg-fer").value;if(!v){toast("Elige una fecha");return}if(!S.config.feriados.includes(v))S.config.feriados.push(v);S.config.feriados.sort();save();render()},
  rmfer(b){S.config.feriados=S.config.feriados.filter(x=>x!==b.dataset.v);save();render()}
};
/* ============ Router ============ */
function route(){return (location.hash.replace("#/","")||"inicio")}
function render(){
  const r=route(),R=ROUTES[r]||ROUTES.inicio,role=UI.role;
  $("#nav").innerHTML=Object.entries(ROUTES).filter(([k,v])=>v.roles.includes(role)).map(([k,v])=>`<a href="#/${k}" ${k===r?'aria-current="page"':""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${v.icon}</svg>${v.t}${k==="homologacion"&&S.pend.length?` <span class="count" style="margin-left:auto">${S.pend.length}</span>`:""}${k==="nomina"&&S.sol.some(s=>s.estado==="abierta")?` <span class="count" style="margin-left:auto">${S.sol.filter(s=>s.estado==="abierta").length}</span>`:""}</a>`).join("");
  $("#who-name").textContent=ROLES[role].nombre;$("#who-role").textContent=ROLES[role].rol;
  $("#crumbs").textContent=`Gestión de solicitudes / ${R.t}`;
  const ps=periods();if(!UI.period)UI.period=periodOf(S.config.now).start;
  $("#period").innerHTML=ps.map(p=>`<option value="${p.start}" ${p.start===UI.period?"selected":""}>${p.label}${p.start===periodOf(S.config.now).start?" (actual)":""}</option>`).join("");
  $("#period").disabled=!["inicio","horas"].includes(r);
  if(!R.roles.includes(role)){$("#view").innerHTML=`<div class="card denied"><b>No tienes acceso a ${R.t}</b><p class="sub">Esta sección es para: ${R.roles.map(x=>ROLES[x].rol).join(", ")}. Cambia el rol en “Ver como” para probarla.</p><button class="btn btn-primary" data-go="inicio">Ir a Inicio</button></div>`;return}
  CURV=r;$("#view").innerHTML=V[r]();
  document.querySelectorAll("details.guide").forEach(d=>d.ontoggle=()=>{UI.g[d.dataset.k]=d.open});
  const q=$("#q");if(q){q.oninput=e=>{UI.q=e.target.value.trim().toLowerCase();const pos=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)}}
  const ef=$("#empf");if(ef)ef.onchange=e=>{UI.emp=e.target.value;render()};
  document.querySelectorAll("details.tk").forEach(d=>d.ontoggle=()=>{if(d.open)UI.openTk=d.dataset.tk;else if(UI.openTk===d.dataset.tk)UI.openTk=null});
}
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){location.hash="#/"+g.dataset.go;return}
  const a=e.target.closest("[data-act]");if(a){e.preventDefault();e.stopPropagation();ACT[a.dataset.act](a);return}
  const c=e.target.closest(".chip[data-cat]");if(c){UI.cat=c.dataset.cat;render();return}
  const en=e.target.closest("[data-entry]");if(en){entryDetail(en.dataset.entry);return}
  const pn=e.target.closest("[data-pend]");if(pn){pendDetail(pn.dataset.pend);return}
  const rn=e.target.closest("[data-run]");if(rn){runDetail(rn.dataset.run);return}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("#drawer").classList.contains("open"))closeDrawer();
  if((e.key==="Enter"||e.key===" ")&&e.target.matches("tr[data-entry]")){e.preventDefault();entryDetail(e.target.dataset.entry)}
});
$("#d-close").onclick=closeDrawer;$("#d-close2").onclick=closeDrawer;$("#scrim").onclick=closeDrawer;
$("#role").onchange=e=>{UI.role=e.target.value;UI.emp="";UI.q="";if(!ROUTES[route()].roles.includes(UI.role))location.hash="#/inicio";render()};
$("#period").onchange=e=>{UI.period=e.target.value;render()};
$("#reset").onclick=()=>{if(confirm("¿Reiniciar todos los datos de demostración?")){try{localStorage.removeItem(STORE)}catch(e){}S=SEED();S.config.now="2026-09-18T02:00";runJob("Automática (diaria 02:00)");S.config.now="2026-09-18T10:00";UI.period=null;save();render();toast("Datos reiniciados")}};
$("#theme").onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("he-theme",r.dataset.theme)}catch(e){}};
try{const t=localStorage.getItem("he-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
window.addEventListener("hashchange",()=>{UI.q="";closeDrawer();render()});
render();
</script>

</body>
